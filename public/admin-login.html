<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ziyokor | Admin Login</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #090713;
        color: white;
        font-family: Arial, sans-serif;
      }

      .login-card {
        width: min(400px, 92%);
        padding: 35px;
        border: 1px solid #35245d;
        border-radius: 20px;
        background: #171126;
        box-shadow: 0 20px 60px #0007;
      }

      h1 {
        color: #a78bfa;
        text-align: center;
        margin-bottom: 8px;
      }

      p {
        text-align: center;
        color: #aaa;
        margin-bottom: 30px;
      }

      input {
        width: 100%;
        padding: 14px;
        margin-bottom: 15px;
        border: 1px solid #49366f;
        border-radius: 10px;
        background: #0e0a19;
        color: white;
        font-size: 15px;
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #7c3aed;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #6d28d9;
      }

      #message {
        margin-top: 18px;
        text-align: center;
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h1>ZIYOKOR</h1>
      <p>Admin boshqaruv paneli</p>

      <form id="loginForm">
        <input
          id="username"
          placeholder="Login"
          autocomplete="username"
          required
        />

        <input
          id="password"
          type="password"
          placeholder="Parol"
          autocomplete="current-password"
          required
        />

        <button type="submit">Kirish</button>
      </form>

      <div id="message"></div>
    </div>

    <script>
      const form = document.querySelector("#loginForm");
      const message = document.querySelector("#message");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.querySelector("#username").value;

        const password = document.querySelector("#password").value;

        try {
          const response = await fetch("/api/admin/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ username, password }),
          });

          const data = await response.json();

          if (!response.ok) {
            message.textContent = data.message;
            return;
          }

          window.location.href = "/admin.html";
        } catch (error) {
          message.textContent = "Server bilan aloqa yo'q";
        }
      });
    </script>
  </body>
</html>
